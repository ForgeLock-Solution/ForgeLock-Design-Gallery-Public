<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explorar diseños | ForgeLock</title><meta name="description" content="Explora seis demostraciones web de ForgeLock en distintas vistas."><style>
:root{font-family:system-ui,sans-serif;background:#101815;color:#f2f6f1}*{box-sizing:border-box}body{margin:0}button,select,a{font:inherit}a{color:inherit}button,select{border:1px solid #587460;border-radius:8px;background:#203027;color:#fff;padding:10px;min-height:44px;cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #c1e9ba;outline-offset:3px}.shell{display:flex;min-height:100dvh}.sidebar{width:210px;flex-shrink:0;background:#19261d;padding:20px 12px;display:grid;align-content:start;gap:10px}.brand{font-weight:800;font-size:1.4rem;text-decoration:none;margin-bottom:20px}.sidebar button{text-align:left}.sidebar button[aria-current=true]{background:#b7dcb0;color:#122017}.main{min-width:0;flex:1;display:flex;flex-direction:column}.toolbar{display:flex;align-items:center;gap:10px;padding:12px 18px;flex-wrap:wrap;border-bottom:1px solid #385040}.toolbar label{display:flex;align-items:center;gap:8px}.toolbar .spacer{flex:1}.frame-area{flex:1;min-height:75dvh;background:#303b34;padding:20px;display:flex;justify-content:center;align-items:stretch}.frame-area iframe{background:white;border:0;width:100%;min-height:75dvh;border-radius:8px;box-shadow:0 12px 40px #0005}.frame-area[data-device=mobile] iframe{max-width:390px}.frame-area[data-device=tablet] iframe{max-width:768px}.frame-area[data-device=desktop] iframe{max-width:none}.frame-area[data-full=true]{padding:0}.frame-area[data-full=true] iframe{max-width:none;border-radius:0}.notice{font-size:.78rem;color:#c2d3c5;padding:8px 18px}.mobile-nav{display:none}.quote{background:#b7dcb0;color:#132117;text-decoration:none;border-radius:8px;padding:12px;font-weight:750}.hidden{display:none!important}@media(max-width:760px){.sidebar{display:none}.toolbar{padding:10px}.toolbar label{flex:1}.toolbar select{max-width:140px}.frame-area{padding:8px;min-height:calc(100dvh - 190px)}.frame-area iframe{min-height:calc(100dvh - 190px)}.mobile-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#19261d;padding:8px;position:sticky;bottom:0;z-index:5}.mobile-nav button,.mobile-nav a{font-size:.82rem;text-align:center}.notice{font-size:.72rem}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}</style></head>
<body><div class="shell"><aside class="sidebar" aria-label="Navegar entre diseños"><a class="brand" href="./">ForgeLock</a><div id="side-buttons"></div><a href="./">← Volver al catálogo</a></aside><div class="main"><header class="toolbar"><a href="./">← Catálogo</a><label>Diseño <select id="design"></select></label><label>Vista <select id="device"><option value="mobile">Celular</option><option value="tablet">Tablet</option><option value="desktop">Escritorio</option></select></label><button id="fullscreen" aria-pressed="false">Pantalla completa</button><span class="spacer"></span><a class="quote" id="quote" target="_blank" rel="noopener noreferrer">Cotizar diseño</a></header><main class="frame-area" id="frame-area" data-device="mobile"><iframe id="demo" title="Demostración web seleccionada" loading="eager" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-forms"></iframe></main><p class="notice">Experiencia conceptual: las operaciones de pago, reservas y pedidos reales no están habilitadas por este navegador. La vista por ancho es orientativa.</p><nav class="mobile-nav" aria-label="Navegación móvil"><button id="previous">← Anterior</button><span id="counter" aria-live="polite"></span><button id="next">Siguiente →</button><a class="quote" id="mobile-quote" target="_blank" rel="noopener noreferrer">Cotizar</a></nav></div></div>
<script>
'use strict';const designs=[['FL-001','Sabor'],['FL-002','Aura'],['FL-003','Habitat'],['FL-004','Nova Store'],['FL-005','Axis'],['FL-006','Impulso']];const $=id=>document.getElementById(id);let selected=Math.max(0,designs.findIndex(d=>d[0]===new URLSearchParams(location.search).get('design')));const select=$('design');designs.forEach(d=>select.add(new Option(d[1],d[0])));$('side-buttons').style.display='grid';$('side-buttons').style.gap='8px';designs.forEach((d,i)=>{const b=document.createElement('button');b.textContent=d[1];b.addEventListener('click',()=>change(i));$('side-buttons').append(b)});function change(i){selected=(i+designs.length)%designs.length;const [id,name]=designs[selected];select.value=id;$('demo').src='./disenos/'+id+'/';$('demo').title='Demostración '+name;const url='https://wa.me/573123007530?text='+encodeURIComponent('Hola, ForgeLock. Quiero cotizar el diseño '+id+' '+name+'.');$('quote').href=url;$('mobile-quote').href=url;$('counter').textContent=(selected+1)+' / '+designs.length;Array.from($('side-buttons').children).forEach((b,j)=>b.setAttribute('aria-current',String(j===selected)));history.replaceState(null,'','?design='+encodeURIComponent(id))}select.addEventListener('change',()=>change(designs.findIndex(d=>d[0]===select.value)));$('device').addEventListener('change',e=>$('frame-area').dataset.device=e.target.value);$('previous').addEventListener('click',()=>change(selected-1));$('next').addEventListener('click',()=>change(selected+1));$('fullscreen').addEventListener('click',()=>{const area=$('frame-area');const next=area.dataset.full!=='true';area.dataset.full=String(next);$('fullscreen').setAttribute('aria-pressed',String(next));$('fullscreen').textContent=next?'Salir de pantalla completa':'Pantalla completa'});change(selected);
</script></body></html>
